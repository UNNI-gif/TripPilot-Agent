version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trippilot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TripPilot Agent
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=sqlite:///./trippilot.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:80
    volumes:
      - trippilot_data:/app
    networks:
      - trippilot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trippilot_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trippilot_network

networks:
  trippilot_network:
    driver: bridge

volumes:
  trippilot_data:
